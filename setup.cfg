[metadata]
name = lightthecandle
version = 0.1.3
description = A local-first software delivery control plane.
long_description = file: README.md
long_description_content_type = text/markdown
author = Aaron Robbins
author_email = aaron@faultpilot.com.au
url = https://github.com/FaultPilot/lightthecandle
project_urls =
    Documentation = https://github.com/FaultPilot/lightthecandle/tree/main/docs
    Issues = https://github.com/FaultPilot/lightthecandle/issues
    Source = https://github.com/FaultPilot/lightthecandle
license = Apache-2.0
license_files = LICENSE
keywords = software-development, sdlc, engineering, delivery, orchestration
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Operating System :: MacOS
    Operating System :: POSIX :: Linux

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
lightthecandle =
    policies/*.json

[options.entry_points]
console_scripts =
    lightthecandle = lightthecandle.cli:main
