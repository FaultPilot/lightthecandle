name: Bug report
description: Report a reproducible, non-security beta defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private source, client data, or vulnerability details.
        Security reports follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Light the Candle version
      placeholder: 0.1.3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and Codex or Claude Code version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Use synthetic data and include the exact command and result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
